<!doctype html>
<html><head><meta charset="utf-8"><title>PcsConnector screen</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
img{width:100vw;height:100vh;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
#m{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#888;font:16px system-ui}</style></head>
<body><img id="s" alt="" draggable="false"><div id="m">Screen sharing stopped. You can close this window.</div>
<script>
const img=document.getElementById('s'),m=document.getElementById('m');
img.src='/api/stream?'+Date.now();
img.onerror=()=>{img.style.display='none';m.style.display='flex';setTimeout(()=>window.close(),1500)};
let q=[],busy=false,lastMove=null;
function flush(){
  if(lastMove){q.push(lastMove);lastMove=null}
  if(!q.length||busy)return;
  const b=q;q=[];busy=true;
  fetch('/api/input',{method:'POST',headers:{'X-PCSC':'1'},body:JSON.stringify(b)}).finally(()=>{busy=false;if(q.length||lastMove)flush()});
}
setInterval(flush,16);
// position inside the visible picture (object-fit: contain), 0..1
function pos(e){
  const W=img.naturalWidth||innerWidth,H=img.naturalHeight||innerHeight;
  const s=Math.min(innerWidth/W,innerHeight/H),w=W*s,h=H*s,ox=(innerWidth-w)/2,oy=(innerHeight-h)/2;
  return{x:Math.min(1,Math.max(0,(e.clientX-ox)/w)),y:Math.min(1,Math.max(0,(e.clientY-oy)/h))};
}
const btn=b=>b===1?1:b===2?2:0;
addEventListener('mousemove',e=>{const p=pos(e);lastMove={e:'m',x:p.x,y:p.y}});
addEventListener('mousedown',e=>{e.preventDefault();const p=pos(e);q.push({e:'d',x:p.x,y:p.y,b:btn(e.button)});flush()});
addEventListener('mouseup',e=>{e.preventDefault();const p=pos(e);q.push({e:'u',x:p.x,y:p.y,b:btn(e.button)});flush()});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{e.preventDefault();const d=Math.round(-e.deltaY*1.2);if(d){q.push({e:'w',d});flush()}},{passive:false});
// KeyboardEvent.code -> Windows virtual key (and whether it is an extended key)
const VK={Backspace:8,Tab:9,Enter:13,ShiftLeft:160,ShiftRight:161,ControlLeft:162,ControlRight:163,AltLeft:164,AltRight:165,Pause:19,CapsLock:20,Escape:27,Space:32,
PageUp:33,PageDown:34,End:35,Home:36,ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40,Insert:45,Delete:46,MetaLeft:91,MetaRight:92,ContextMenu:93,
Semicolon:186,Equal:187,Comma:188,Minus:189,Period:190,Slash:191,Backquote:192,BracketLeft:219,Backslash:220,BracketRight:221,Quote:222,
NumpadMultiply:106,NumpadAdd:107,NumpadSubtract:109,NumpadDecimal:110,NumpadDivide:111,NumpadEnter:13,NumLock:144,ScrollLock:145};
for(let i=0;i<26;i++)VK['Key'+String.fromCharCode(65+i)]=65+i;
for(let i=0;i<10;i++){VK['Digit'+i]=48+i;VK['Numpad'+i]=96+i}
for(let i=1;i<=12;i++)VK['F'+i]=111+i;
const EXT=new Set(['ArrowLeft','ArrowUp','ArrowRight','ArrowDown','Insert','Delete','Home','End','PageUp','PageDown','ControlRight','AltRight','MetaLeft','MetaRight','ContextMenu','NumpadDivide','NumpadEnter']);
function key(e,t){const k=VK[e.code];if(!k)return;e.preventDefault();q.push({e:t,k,b:EXT.has(e.code)?1:0});flush()}
addEventListener('keydown',e=>key(e,'kd'));
addEventListener('keyup',e=>key(e,'ku'));
addEventListener('dblclick',e=>{if(e.ctrlKey)document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
</script></body></html>
