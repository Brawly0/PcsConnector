<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Segoe UI, system-ui, -apple-system, Roboto, Ubuntu, sans-serif">
  <title>PcsConnector: the Windows PC's mouse and keyboard move onto the Ubuntu laptop next to it</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4f46e5"/>
    </marker>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde7d6"/><stop offset="1" stop-color="#f8cfae"/>
    </linearGradient>
  </defs>
  <rect width="880" height="360" rx="18" fill="#f5f6f9"/>

  <!-- Windows PC monitor -->
  <rect x="70" y="40" width="330" height="200" rx="12" fill="#1f2330"/>
  <rect x="82" y="52" width="306" height="176" rx="5" fill="url(#scr)"/>
  <rect x="96" y="66" width="130" height="84" rx="6" fill="#fff" opacity=".9"/>
  <rect x="106" y="78" width="90" height="7" rx="3.5" fill="#a5b4fc"/>
  <rect x="106" y="92" width="110" height="6" rx="3" fill="#e0e7ff"/>
  <rect x="106" y="104" width="100" height="6" rx="3" fill="#e0e7ff"/>
  <rect x="106" y="116" width="70" height="6" rx="3" fill="#e0e7ff"/>
  <rect x="240" y="96" width="132" height="110" rx="6" fill="#fff" opacity=".75"/>
  <rect x="82" y="210" width="306" height="18" fill="#1f2330" opacity=".85"/>
  <rect x="226" y="214" width="18" height="10" rx="2" fill="#818cf8"/>
  <path d="M215 240h40l8 34h-56z" fill="#1f2330"/>
  <rect x="180" y="272" width="110" height="10" rx="5" fill="#1f2330"/>
  <text x="235" y="312" text-anchor="middle" font-size="17" font-weight="650" fill="#14161c">Windows PC</text>
  <text x="235" y="332" text-anchor="middle" font-size="13" fill="#687083">your mouse and keyboard</text>

  <!-- Ubuntu laptop -->
  <rect x="540" y="92" width="250" height="158" rx="10" fill="#1f2330"/>
  <rect x="551" y="103" width="228" height="136" rx="4" fill="url(#scr2)"/>
  <rect x="551" y="103" width="228" height="12" fill="#3b2f2f" opacity=".75"/>
  <rect x="566" y="128" width="104" height="70" rx="6" fill="#fff" opacity=".9"/>
  <rect x="576" y="139" width="70" height="6" rx="3" fill="#f4a261"/>
  <rect x="576" y="151" width="84" height="5" rx="2.5" fill="#fde7d6"/>
  <rect x="576" y="161" width="76" height="5" rx="2.5" fill="#fde7d6"/>
  <path d="M515 250h300l-14 18H529z" fill="#2b3040"/>
  <rect x="640" y="250" width="50" height="6" rx="3" fill="#1f2330"/>
  <text x="665" y="312" text-anchor="middle" font-size="17" font-weight="650" fill="#14161c">Ubuntu laptop</text>
  <text x="665" y="332" text-anchor="middle" font-size="13" fill="#687083">extra screen, controlled from the PC</text>

  <!-- the crossing -->
  <path d="M352 150 C 430 110, 520 110, 690 160" fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#ah)"/>
  <g transform="translate(338 138)">
    <path d="M0 0L0 22L6 17L10 26L14 24L10 15L18 15z" fill="#fff" stroke="#14161c" stroke-width="1.6" stroke-linejoin="round" opacity=".55"/>
  </g>
  <g transform="translate(694 160)">
    <path d="M0 0L0 22L6 17L10 26L14 24L10 15L18 15z" fill="#fff" stroke="#14161c" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <rect x="380" y="52" width="150" height="44" rx="10" fill="#fff" stroke="#e2e5ec"/>
  <text x="455" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4f46e5">Move off the edge…</text>
  <text x="455" y="87" text-anchor="middle" font-size="12.5" fill="#14161c">…and keep going</text>

  <!-- shared things -->
  <g font-size="12.5" font-weight="600">
    <rect x="413" y="196" width="94" height="26" rx="13" fill="#eef0ff"/><text x="460" y="213" text-anchor="middle" fill="#4f46e5">Clipboard</text>
    <rect x="413" y="230" width="94" height="26" rx="13" fill="#eef0ff"/><text x="460" y="247" text-anchor="middle" fill="#4f46e5">Files</text>
  </g>
  <path d="M410 209h-14M510 209h14M410 243h-14M510 243h14" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
</svg>
